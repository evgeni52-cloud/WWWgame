<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WWWGame - Slots</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- PixiJS библиотека для анимированной 2D-графики -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0118;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
        }
        
        #header {
            margin-top: 20px;
            text-align: center;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        #game-container {
            width: 100vw;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #controls {
            margin-bottom: 30px;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: center;
        }

        .spin-btn {
            background: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%);
            color: #ffffff;
            border: none;
            outline: none;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 25px rgba(168, 85, 247, 0.5);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .spin-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body>

    <div id="header">
        <h1 class="title">WWWGame</h1>
    </div>

    <div id="game-container"></div>

    <div id="controls">
        <button class="spin-btn" id="spin-btn">Крутить</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Создание PixiJS приложения
        const app = new PIXI.Application({
            width: Math.min(window.innerWidth - 20, 400),
            height: 320,
            backgroundColor: 0x130225,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true
        });

        document.getElementById('game-container').appendChild(app.view);

        // Настройки барабанов (5 барабанов, 3 ряда)
        const REEL_COUNT = 5;
        const SYMBOL_SIZE = 60;
        const MARGIN = 10;
        
        const slotContainer = new PIXI.Container();
        app.stage.addChild(slotContainer);

        // Центрируем контейнер
        const totalWidth = REEL_COUNT * (SYMBOL_SIZE + MARGIN) - MARGIN;
        slotContainer.x = (app.screen.width - totalWidth) / 2;
        slotContainer.y = (app.screen.height - (3 * (SYMBOL_SIZE + MARGIN) - MARGIN)) / 2;

        // Символы по умолчанию (текстовая заглушка с логотипом W)
        for (let r = 0; r < REEL_COUNT; r++) {
            for (let row = 0; row < 3; row++) {
                const graphics = new PIXI.Graphics();
                graphics.beginFill(0x280945);
                graphics.drawRoundedRect(0, 0, SYMBOL_SIZE, SYMBOL_SIZE, 12);
                graphics.endFill();
                graphics.lineStyle(2, 0xa855f7, 0.8);
                graphics.drawRoundedRect(0, 0, SYMBOL_SIZE, SYMBOL_SIZE, 12);

                graphics.x = r * (SYMBOL_SIZE + MARGIN);
                graphics.y = row * (SYMBOL_SIZE + MARGIN);

                const text = new PIXI.Text('W', {
                    fontFamily: 'Arial',
                    fontSize: 28,
                    fontWeight: 'bold',
                    fill: '#a855f7'
                });
                text.anchor.set(0.5);
                text.x = SYMBOL_SIZE / 2;
                text.y = SYMBOL_SIZE / 2;

                graphics.addChild(text);
                slotContainer.addChild(graphics);
            }
        }

        // Обработчик кнопки "Крутить"
        document.getElementById('spin-btn').addEventListener('click', () => {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            alert('Слот запущен! На следующем шаге добавляем анимацию вращения.');
        });
    </script>
</body>
</html>
